name: Atomic Task
description: One agent-sized goal with a fast verification loop
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Keep this task small enough for one agent and one focused feedback loop.
        Split independent outcomes into separate issues.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe one observable outcome in one or two sentences.
      placeholder: "Add ... so that ..."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State the behavioral boundary, not expected files or code locations.
      value: |
        - Include:
        - Exclude:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add three to five concrete, independently verifiable checks.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: Put the fastest focused Nix command first and the required final gate last.
      value: |
        ```sh
        nix develop -c ctest --preset test --output-on-failure
        nix build .#checks.x86_64-linux.pr
        ```
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List only true blockers. Leave blank when there are none.
      placeholder: "- #123"

  - type: textarea
    id: hardware_evidence
    attributes:
      label: Hardware evidence
      description: For gfx1151 or XDNA2 work, state the target, command, artifact, and valid not-run or negative outcome. Leave blank for host-only work.
