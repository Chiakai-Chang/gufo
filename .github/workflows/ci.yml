name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pr-check:
    name: Milestone 0 PR Gates & Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Run Nix Flake Check
        run: nix flake check

      - name: Run Canonical PR Test Suite
        run: |
          nix build .#checks.x86_64-linux.pr --print-build-logs
          ./result/bin/strix-server --version
          ./result/bin/strix-server --help
          cat ./result/pr-summary.txt
